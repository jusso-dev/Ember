# Free OSS Trivy (Aqua Security). Public GitHub repos get Code Scanning SARIF free.
# Actions are pinned by commit SHA (tag-only refs were force-pushed in past incidents).
name: Trivy

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly Monday 03:17 UTC — catch new CVEs without waiting on a push.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Free public Trivy DBs (no Aqua platform token).
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db

jobs:
  # ---------------------------------------------------------------------------
  # Filesystem: dependencies, secrets, and misconfig across the repo.
  # ---------------------------------------------------------------------------
  fs:
    name: Filesystem (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          # Always produce SARIF for Code Scanning; gate fails in the table step.
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem scan (table, fail on findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Container images: same Dockerfiles as docker-compose production stack.
  # ---------------------------------------------------------------------------
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            context: .
            file: Dockerfile
            tag: ember-control-plane:ci
            build-args: ""
          - name: web
            context: ./web
            file: ./web/Dockerfile
            tag: ember-web:ci
            build-args: CONTROL_PLANE_URL=http://control-plane:8080

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=trivy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.name }}

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.tag }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload image SARIF
        if: always() && hashFiles(format('trivy-image-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Trivy image scan (table, fail on findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.tag }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
