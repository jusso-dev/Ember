name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace
      - name: Shared types
        run: cargo test -p ember-shared
      - name: Control plane binary
        run: cargo build -p ember-control-plane

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Regenerate web/lib/types from ember-shared so the build never depends
      # on stale or missing committed bindings alone.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Export TypeScript bindings
        run: cargo test -p ember-shared
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm build
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:8080

  e2e:
    name: E2E (Lightpanda + Playwright)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Build control plane
        run: cargo build -p ember-control-plane
      - name: Export TypeScript bindings
        run: cargo test -p ember-shared
      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: web
        run: pnpm build
        env:
          CONTROL_PLANE_URL: http://127.0.0.1:18080
      - name: Install e2e
        working-directory: e2e
        run: pnpm install
      - name: Run e2e
        env:
          CI: true
          E2E_WEB_MODE: prod
          E2E_CP_PORT: 18080
          E2E_WEB_PORT: 13000
          E2E_CDP_PORT: 19222
        run: bash scripts/e2e.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
